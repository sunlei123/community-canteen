<div class="space-y-6 animate-in fade-in slide-in-from-bottom duration-300">
    <!-- 头部卡片：高端渐变阴影 -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between bg-white p-6 rounded-2xl border shadow-sm gap-4 transition-all duration-300 hover:shadow-md">
        <div>
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 flex items-center gap-2">
                <span class="p-2 bg-blue-50 text-blue-600 rounded-xl">🛡️</span>
                <span>系统用户管理</span>
            </h2>
            <p class="text-xs sm:text-sm text-gray-500 mt-1.5 font-medium">安全配置系统账号，动态调整各运营人员的登录用户名、角色以及操作权限。</p>
        </div>
        <div>
            <button id="addAdminBtn" class="w-full md:w-auto inline-flex items-center justify-center px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-xl hover:shadow-blue-500/30 transition-all duration-200 font-semibold text-sm focus:outline-none gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                添加系统用户
            </button>
        </div>
    </div>

    <!-- 列表卡片 -->
    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md">
        <!-- 头部筛选区 -->
        <div class="p-5 border-b bg-gray-50/50 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full sm:max-w-xs">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                </span>
                <input type="text" id="adminSearchInput" class="block w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl shadow-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm font-medium" placeholder="搜索用户名或姓名...">
            </div>
            <div class="text-xs text-gray-400 font-medium">
                双击行内记录或点击操作栏可直接编辑
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-4">真实姓名</th>
                        <th class="px-6 py-4">登录账号 (用户名)</th>
                        <th class="px-6 py-4">系统角色</th>
                        <th class="px-6 py-4">安全邮箱</th>
                        <th class="px-6 py-4">创建时间</th>
                        <th class="px-6 py-4 text-center">操作选项</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 text-gray-700 font-medium" id="adminTableBody">
                    <!-- 动态渲染数据列 -->
                </tbody>
            </table>
        </div>
        
        <!-- 空状态提示 -->
        <div id="adminEmptyState" class="hidden text-center py-16 bg-white">
            <div class="text-5xl mb-3">🛡️</div>
            <h3 class="text-base font-bold text-gray-800">暂无系统用户记录</h3>
            <p class="text-xs text-gray-400 mt-1 max-w-xs mx-auto">请点击右上角的“添加系统用户”按钮，为系统指派新的运营或管理人员。</p>
        </div>
    </div>
</div>
