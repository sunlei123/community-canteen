<div class="mb-6 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-800">系统设置</h2>
    <button id="saveSettingsBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center shadow-sm">
        <i data-lucide="save" class="w-5 h-5 mr-2"></i>
        保存设置
    </button>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- 客服热线配置卡片 -->
    <div class="card p-6 bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="flex items-center mb-4">
            <div class="p-2 bg-yellow-50 rounded-lg mr-3">
                <i data-lucide="phone" class="w-5 h-5 text-yellow-600"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800">客服热线配置</h3>
        </div>
        
        <form id="contactSettingsForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">微信客服号</label>
                <input type="text" id="settingWechat" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="例如: dong_teacher_kitchen">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">紧急联系电话</label>
                <input type="text" id="settingPhone" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="例如: 139-0000-0001">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">签名寄语</label>
                <input type="text" id="settingQuote" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="例如: “每一道菜，都用做给自己孩子的心意去烹饪。” —— 董老师">
                <p class="mt-1 text-xs text-gray-500">将显示在前端热线名片底部</p>
            </div>
        </form>
    </div>

    <!-- 订餐须知配置卡片 -->
    <div class="card p-6 bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="flex items-center mb-4">
            <div class="p-2 bg-pink-50 rounded-lg mr-3">
                <i data-lucide="book-open" class="w-5 h-5 text-pink-600"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800">订餐须知配置</h3>
        </div>
        
        <form id="noticeSettingsForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <span class="w-2 h-2 bg-pink-500 rounded-full mr-2"></span>配送时间安排
                </label>
                <textarea id="settingNoticeDelivery" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm" placeholder="输入配送时间安排..."></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <span class="w-2 h-2 bg-orange-500 rounded-full mr-2"></span>套餐抵扣规则
                </label>
                <textarea id="settingNoticeDiscount" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm" placeholder="输入套餐价格与抵扣规则..."></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
                    <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>取消与修改规则
                </label>
                <textarea id="settingNoticeCancel" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="输入退改签规则..."></textarea>
            </div>
        </form>
    </div>
</div>
