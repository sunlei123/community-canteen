<div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full overflow-hidden transition-all transform duration-300">
        <!-- 头部区域 -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="receipt" class="h-6 w-6"></i>
                <span class="text-lg font-bold">订单详细信息</span>
            </div>
            <button type="button" id="closeViewOrderHeader" class="text-white hover:text-gray-200 transition-colors">
                <i data-lucide="x" class="h-6 w-6"></i>
            </button>
        </div>
        <!-- 详情内容区 -->
        <div class="p-6 space-y-6 max-h-[75vh] overflow-y-auto" id="viewOrderContent">
            <!-- 动态生成 -->
        </div>
        <!-- 底部操作按钮 -->
        <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 border-t">
            <button type="button" id="closeViewOrder" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors font-medium">
                关闭
            </button>
            <button type="button" id="viewOrderPrintSlip" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center gap-1.5 font-medium shadow-sm">
                <i data-lucide="printer" class="h-4 w-4"></i>
                <span>打印配送小票</span>
            </button>
        </div>
    </div>
</div>
