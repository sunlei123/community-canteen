<div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl transition-all">
        <h3 class="text-lg font-medium text-gray-900 mb-4" id="menuModalTitle">添加菜品</h3>
        <form id="addMenuForm">
            <input type="hidden" id="menuItemId" name="id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">菜品名称 *</label>
                    <input type="text" id="menuItemName" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">分类 *</label>
                    <select id="menuItemCategory" name="category" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="meat">荤菜</option>
                        <option value="veggie">素菜</option>
                        <option value="dessert_fruit">甜点/水果</option>
                        <option value="soup">汤</option>
                        <option value="staple">主食</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">价格 *</label>
                    <input type="number" id="menuItemPrice" name="price" step="0.01" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">描述</label>
                    <textarea id="menuItemDescription" name="description" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">营养信息</label>
                    <input type="text" id="menuItemNutrition" name="nutrition" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">图片上传</label>
                    <input type="file" id="menuImageFile" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <input type="text" id="menuItemImageUrl" name="image" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <!-- 图片实时预览区域 -->
                    <div id="editMenuImagePreviewContainer" class="mt-3 hidden">
                        <span class="text-xs text-gray-500 block mb-1">图片预览（点击缩略图查看大图）：</span>
                        <div class="flex items-center space-x-3 bg-gray-50 p-2 rounded-lg border border-gray-200">
                            <div class="relative group cursor-pointer overflow-hidden rounded-md border border-gray-300 w-16 h-16 flex-shrink-0" id="editMenuImagePreviewWrapper">
                                <img id="editMenuImagePreview" src="" alt="预览图" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
                                <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                    <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-medium text-gray-700 truncate" id="editMenuImagePreviewName">图片已就绪</p>
                                <p class="text-[10px] text-gray-400 truncate" id="editMenuImagePreviewUrlText"></p>
                            </div>
                            <button type="button" id="clearEditMenuImage" class="text-xs text-red-600 hover:text-red-800 font-semibold px-2 py-1 hover:bg-red-50 rounded transition-colors duration-150 focus:outline-none">
                                清除图片
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button type="button" id="cancelAddMenu" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                    取消
                </button>
                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    保存
                </button>
            </div>
        </form>
    </div>
</div>
