<div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white bg-opacity-95 rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-gray-100 transform transition-all duration-300">
        <div class="flex items-center gap-2 mb-4">
            <div class="p-2 bg-yellow-50 text-yellow-600 rounded-lg text-lg">
                🔑
            </div>
            <h3 class="text-lg font-bold text-gray-900">重置家长密码</h3>
        </div>
        <form id="resetPasswordForm" class="space-y-4">
            <input type="hidden" id="resetPasswordUserId" name="id">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">家长姓名</label>
                <input type="text" id="resetPasswordUserName" readonly class="block w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-500 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">设置新密码</label>
                <input type="password" id="resetNewPassword" name="password" placeholder="留空则默认为 123456" class="block w-full px-3.5 py-2.5 border border-gray-300 rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200">
                <p class="mt-1 text-xs text-gray-400">密码长度至少为 6 位，重置成功后将提供明文反馈。</p>
            </div>
            <div class="mt-6 flex justify-end space-x-3 pt-2">
                <button type="button" id="cancelResetPasswordBtn" class="px-4 py-2.5 border border-gray-300 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors focus:outline-none">
                    取消
                </button>
                <button type="submit" class="px-4 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-blue-100 hover:shadow-lg transition-all focus:outline-none">
                    确认重置
                </button>
            </div>
        </form>
    </div>
</div>
