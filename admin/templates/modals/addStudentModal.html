<div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl transition-all">
        <h3 class="text-lg font-medium text-gray-900 mb-4" id="studentModalTitle">添加学生</h3>
        <form id="addStudentForm">
            <input type="hidden" id="studentId" name="id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">快速绑定已有家长 (可选)</label>
                    <select id="studentParentSelector" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm">
                        <option value="">-- 手动填写负责人与手机号 --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">姓名 *</label>
                    <input type="text" id="studentName" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">学校/年级班级 *</label>
                    <input type="text" id="studentClass" name="class" required placeholder="如：榆林路校区4年2班" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">负责人</label>
                    <input type="text" id="studentGuardian" name="guardian" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">手机号 *</label>
                    <input type="tel" id="studentPhone" name="phone" required pattern="1[3-9]\d{9}" placeholder="11位手机号" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">首次订餐日</label>
                    <input type="date" id="studentFirstOrderDate" name="firstOrderDate" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button type="button" id="cancelAddStudent" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                    取消
                </button>
                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    保存
                </button>
            </div>
        </form>
    </div>
</div>
